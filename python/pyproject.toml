[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scphasedcn"
dynamic = ["version"]
description = "Extraction layer of scphasedcn: per-cell depth, read-phased alleles and fragment tables from SPLONGGET single-cell long-read DNA BAMs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luuk Harbers", email = "luuk.harbers@vib.be" }]
requires-python = ">=3.10"
dependencies = ["pysam>=0.22", "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "h5py>=3.8", "anndata>=0.10", "pyyaml>=6"]
keywords = ["single-cell", "copy number", "long reads", "nanopore", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/ljwharbers/scphasedcn"
Issues = "https://github.com/ljwharbers/scphasedcn/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
scphasedcn = "scphasedcn.cli:main"
scphasedcn-extract = "scphasedcn.cli:main"

[tool.setuptools.dynamic]
version = { attr = "scphasedcn.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scphasedcn = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests import the installed package (pip install "./python[test]"); to test a source tree without installing,
# set PYTHONPATH=src
pythonpath = ["tests"]
